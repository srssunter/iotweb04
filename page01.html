<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Itim&family=Monomaniac+One&display=swap"
      rel="stylesheet"/>
    <style>
      body {
        background-color: black;
      }
      a,
      i {
        color: white;
        font-size: 1.5rem;
      }
      .nav-hello span {
        color: rgb(0, 255, 221);
        font-family: 'Itim';
        font-size: 3.5rem;
        font-style: italic;
      }
      .nav-menu a{
        font-family: 'Monomaniac One';
        text-decoration: none;
      }
      .navbar{
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 30px 80px;  /*บ,ล ซ,ข */
    }
    .nav-menu , .nav-hello , .nav-icon{
        width:100% ;
    }
    .nav-hello{
        text-align: center;
    }
    .nav-icon{
        text-align: right;
    }
    .nav-menu{
        display: flex;
        gap: 30px;
    }
    .nav-icon{
        /* text-align: right; */
        display: flex;
        justify-content: flex-end;
        gap: 30px;
    } 
    .per-info span{
        color: white;
        font-family: 'Monomaniac One';
        font-size: 2.5rem;
    }
    .per-info{
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 100px;
    }
    #fwd{
        color: rgb(0, 255, 221);
    }
    .per-pic{
        margin-top: 150px;
        display: flex;
        justify-content: center;
    }
    img{
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 100%;
        border: 5px solid rgb(0, 255, 221);
        padding: 15px;
    }
    a:hover{
        color: rgb(0, 255, 221);
    }
    i:hover{
        color: rgb(0, 255, 221);
    }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- ส่วนของ navbar -->
      <div class="navbar">
        <!-- เมนู -->
        <div class="nav-menu">
          <a href="#">Portfolio</a>
          <a href="#">About me</a>
          <a href="#">Get In Touch</a>
        </div>
        <!-- ข้อความ Hello -->
        <div class="nav-hello">
          <span>hello</span>
        </div>
        <!-- Icon ต่างๆชิดขวา -->
        <div class="nav-icon">
          <a href=""><i class="bi bi-github"></i></a>
          <a href=""><i class="bi bi-instagram"></i></a>
          <a href=""><i class="bi bi-twitter"></i></a>
          <a href=""><i class="bi bi-linkedin"></i></a>
        </div>
      </div>

      <!-- ส่วนของ personal information -->
      <div class="per-info">
        <span>6819M10022</span>
        <span>Sirisak Saechia</span>
        <span id="fwd">Freelance Web Developer</span>
        <span>Based In Thailand</span>
      </div>

      <!-- ส่วนของ personal picture -->
      <div class="per-pic">
        <img src="./images/pp.jpg" alt="person">
      </div>
    </div>
  </body>
</html>
